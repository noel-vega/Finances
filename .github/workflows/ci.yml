name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # shared packages first — apps' `tsc`/`nest build` resolve workspace
      # imports (e.g. `import ... from 'db'`) via each package's compiled
      # dist/, so it has to exist before the apps that depend on it build.
      # packages/ui has no build script (Vite consumes its raw .tsx
      # directly) — deliberately excluded here.
      - name: Build shared packages
        run: |
          npm run build --workspace=db \
            --workspace=logging \
            --workspace=queue \
            --workspace=storage \
            --workspace=email \
            --workspace=email-templates \
            --workspace=merchant-sdk \
            --workspace=storefront-sdk

      - name: Build apps
        run: |
          npm run build --workspace=merchant-api \
            --workspace=storefront-api \
            --workspace=worker \
            --workspace=merchant-web \
            --workspace=storefront-web \
            --workspace=website

      - name: Lint
        # explicit list rather than --workspaces: `pos` (Expo) needs
        # `pos-sdk` built for its import resolver and isn't wired into CI
        # yet — that's OS-13
        run: |
          npm run lint --workspace=merchant-api \
            --workspace=storefront-api \
            --workspace=pos-api \
            --workspace=worker \
            --workspace=merchant-web \
            --workspace=storefront-web \
            --workspace=ui

      - name: Test
        # packages/db creates its pool at import time from DATABASE_URL; the
        # unit specs mock the connection but the string still has to parse.
        # A real DB + integration tests are OS-42.
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
        run: |
          npm run test --workspace=merchant-api \
            --workspace=storefront-api \
            --workspace=worker

  docker-smoke-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [merchant-api, storefront-api, worker, migrate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          push: false
