name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # honor packageManager (package.json) — node 22 ships npm 10, whose
      # `npm ci` can't reconcile this lockfile's `overrides`
      - run: npm install -g npm@11

      - run: npm ci

      # shared packages first — apps' `tsc`/`nest build` resolve workspace
      # imports (e.g. `import ... from 'db'`) via each package's compiled
      # dist/, so it has to exist before the apps that depend on it build.
      # packages/ui has no build script (Vite consumes its raw .tsx
      # directly) — deliberately excluded here.
      - name: Build shared packages
        run: |
          npm run build --workspace=config \
            --workspace=db \
            --workspace=payments \
            --workspace=logging \
            --workspace=queue \
            --workspace=storage \
            --workspace=email \
            --workspace=email-templates \
            --workspace=merchant-sdk \
            --workspace=storefront-sdk

      - name: Build apps
        run: |
          npm run build --workspace=merchant-api \
            --workspace=storefront-api \
            --workspace=pos-api \
            --workspace=worker \
            --workspace=merchant-web \
            --workspace=storefront-web \
            --workspace=website

      - name: Lint
        # explicit list rather than --workspaces: `pos` (Expo) is a
        # different toolchain and runs in its own `pos` job below
        run: |
          npm run lint --workspace=merchant-api \
            --workspace=storefront-api \
            --workspace=pos-api \
            --workspace=worker \
            --workspace=merchant-web \
            --workspace=storefront-web \
            --workspace=ui

      - name: Test
        # storefront-api + worker boot a throwaway Postgres via Testcontainers
        # in jest globalSetup (packages/test-support) and run their specs
        # against real SQL — ubuntu-latest has Docker. merchant-api + pos-api
        # still mock the DB; test/jest.env-setup.cjs gives them a dummy
        # DATABASE_URL so packages/db's import-time pool string parses.
        run: |
          npm run test --workspace=merchant-api \
            --workspace=storefront-api \
            --workspace=pos-api \
            --workspace=worker

  typecheck:
    # `tsc --noEmit` per workspace — catches type errors the build steps
    # miss (test/ specs, packages/ui, packages/seed, website .astro).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11

      - run: npm ci

      # shared packages' dist/ + .d.ts feed cross-workspace type imports —
      # same list as build-lint-test plus pos-sdk (apps/pos imports it)
      - name: Build shared packages
        run: |
          npm run build --workspace=config \
            --workspace=db \
            --workspace=payments \
            --workspace=logging \
            --workspace=queue \
            --workspace=storage \
            --workspace=email \
            --workspace=email-templates \
            --workspace=merchant-sdk \
            --workspace=storefront-sdk \
            --workspace=pos-sdk

      - run: npm run typecheck --workspaces --if-present

  pos:
    # apps/pos (Expo): its own toolchain — eslint-config-expo (flat), no
    # nest build / jest. pos-sdk must be built first — pos imports it in
    # several files and its eslint import resolver + tsc need the dist/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run build --workspace=pos-sdk

      - name: Lint
        run: npm run lint --workspace=pos

      - name: Typecheck
        run: npm run typecheck --workspace=pos

      - name: expo-doctor
        env:
          EXPO_NO_TELEMETRY: "1"
          # skip only the "packages match versions required by installed Expo
          # SDK" sub-check — it queries api.expo.dev for the latest SDK-57
          # patch ranges, so CI goes red the moment Expo cuts a patch release
          # regardless of this repo's contents. `npm run doctor` locally still
          # runs it. The other 20 checks stay hard gates.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
        run: npm run doctor --workspace=pos

  docker-smoke-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [merchant-api, storefront-api, pos-api, worker, migrate]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.target }}.Dockerfile
          push: false
