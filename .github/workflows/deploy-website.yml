name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

# Required repo configuration before this workflow can run:
#   vars.AWS_DEPLOY_ROLE_ARN_WEBSITE = terraform output deploy_role_website_arn
#   vars.AWS_REGION                  = "us-east-1"
#   A GitHub Environment named "production" with a required
#   reviewer — same approval gate used by the (still-dormant) full cd.yml.
#
# Milestone 1 of the wider CI/CD rollout: apps/website is the only frontend
# wired up so far — its S3 bucket, CloudFront distribution, and this
# workflow's IAM role (modules/deploy-role, scoped to just this bucket/
# distribution — no ECR/ECS permissions) are the only pieces of
# infra/terraform/envs/production intended to be applied right now.


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # honor packageManager (package.json) — node 22 ships npm 10, whose
      # `npm ci` can't reconcile this lockfile's `overrides`
      - run: npm install -g npm@11

      - run: npm ci

      - name: Build website
        run: npm run build --workspace=website

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN_WEBSITE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        run: |
          set -euo pipefail

          BUCKET=$(aws ssm get-parameter --name /ordersail/production/frontend/website-bucket --query 'Parameter.Value' --output text)
          DIST_ID=$(aws ssm get-parameter --name /ordersail/production/frontend/website-distribution --query 'Parameter.Value' --output text)
          DIST_DIR="apps/website/dist"

          # hashed build assets get a 1-year immutable cache; index.html is
          # synced separately with no-cache since it's the one file whose
          # content actually changes per deploy under the same URL
          aws s3 sync "$DIST_DIR" "s3://$BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html
          aws s3 cp "$DIST_DIR/index.html" "s3://$BUCKET/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/"
